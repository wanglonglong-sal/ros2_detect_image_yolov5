action_recognizer:
  ros__parameters:
    backend: "slowfast_ava"      # options: stub, slowfast, slowfast_ava
    # AVA-style full-frame settings
    clip_len: 64                 # frames per clip (matches AVA cfg)
    sample_rate: 2               # temporal sampling rate
    alpha: 4                     # slow pathway temporal stride (T/alpha)
    input_size: 256              # model input spatial size (TEST_CROP_SIZE)
    multi_label: true            # AVA uses multi-label classification (sigmoid)
    # Runtime
    inference_stride: 8          # run inference every N frames
    min_box_size: 8              # px; ignore tiny boxes
    allowed_actors: ["person", "bicycle", "motorcycle", "car", "bus", "truck"]
    output_topic: "/actions"
    output_video_path: "/mnt/d/Dataset/Output/actions_output.mp4"
    output_fps: 30.0
    enable_output_video: false
    # Model & labels
    model_path: "/home/wanglonglong/Learn_ROS2/03.my_robot/src/action_recognizer/models/slowfast_ava_r101_64x2_ts.pt"
    labels_path: "/home/wanglonglong/Learn_ROS2/03.my_robot/src/action_recognizer/labels/ava_labels.txt"
    device: "cpu"                # cpu or cuda[:id]
